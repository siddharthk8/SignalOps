[project]
name = "signalops-backend"
version = "1.1.6"

[tool.fastapi]
entrypoint = "main:app"

# =========================================================
# Ruff
# =========================================================
[tool.ruff]
line-length = 88
target-version = "py312"
fix = true
show-fixes = true

# pyproject.toml is now inside backend/
src = ["."]

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "alembic",
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    # "SIM",    # simplify
    "C4",      # comprehensions
    "RUF",     # Ruff-specific rules
    "ASYNC",   # async-related rules
]

ignore = [
    "E501",    # line length (including comments)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# =========================================================
# Pytest
# =========================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
