services:
  so_nginx:
    image: nginx:1.30.4-alpine
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # ACME Challenge
      - ./certbot/www:/var/www/certbot
      # Certificates
      - ./certbot/letsencrypt:/etc/letsencrypt
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: siddharthk8/signalops-frontend:${FRONTEND_IMAGE_TAG}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - ENV=${ENV}
    expose:
      - "5173"
    restart: unless-stopped

  migrate:
    image: siddharthk8/signalops-backend:${IMAGE_TAG}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no" # YAML treats no as a boolean, so it's better to quote it
    env_file:
      - ${ENV_DIR}/signalops/backend/.env.production
    command: alembic upgrade head
    depends_on:
      so_postgres:
        condition: service_healthy

  backend:
    image: siddharthk8/signalops-backend:${IMAGE_TAG}
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    env_file:
      - ${ENV_DIR}/signalops/backend/.env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
      so_postgres:
        condition: service_healthy
      so_redis:
        condition: service_healthy
    healthcheck:
      # urllib avoids requirement of installing curl into the image.
      test: ["CMD-SHELL", "python -c \"import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  so_redis:
    image: redis:7.4.9-alpine3.21
    expose:
      - "6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  so_postgres:
    image: postgres:16.14-alpine3.23
    expose:
      - "5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
