services:
  migrate:
    image: siddharthk8/signalops:${IMAGE_TAG}
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ${ENV_DIR}/SignalOps/backend/.env
      - ${ENV_DIR}/SignalOps/backend/prod.env
    command: alembic upgrade head
    depends_on:
      so_postgres:
        condition: service_healthy

  backend:
    image: siddharthk8/signalops:${IMAGE_TAG}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - ${ENV_DIR}/SignalOps/backend/.env
      - ${ENV_DIR}/SignalOps/backend/prod.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      so_redis:
        condition: service_healthy

  so_redis:
    image: redis:7.4.9-alpine3.21
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  so_postgres:
    image: postgres:16.14-alpine3.23
    ports:
      - "5432:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
