<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />

		<!-- Primary Meta Tags -->
		<title>SignalOps</title>
		<meta
			name="title"
			content="SignalOps — Turn Application Logs into Actionable Operational Insights"
		/>
		<meta
			name="description"
			content="SignalOps transforms chaotic application logs into structured, actionable operational insights using automated ingestion, semantic parsing, and AI intelligence."
		/>
		<meta
			name="keywords"
			content="application logs, log ingestion, incident correlation, operational insights, log parsing, AI incident analysis, DevOps, observability, SignalOps"
		/>
		<meta name="author" content="SignalOps" />
		<meta name="robots" content="index, follow" />
		<link rel="canonical" href="https://signalops.siddharthkr.com/" />

		<!-- Favicons & Manifest -->
		<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="shortcut icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="SignalOps" />
		<link rel="manifest" href="/site.webmanifest" />

		<!-- Viewport -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Theme Script (Tailwind FOUC Prevention) -->
		<script>
			(function () {
				// TailwindCSS suggestion to avoid FOUC (Flash Of Unstyled Content)
				const theme = localStorage.theme;
				const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

				// (theme === "system" && prefersDark) is important below.
				// since we are storing "system" in localStorage.
				if (
					theme === "dark" ||
					(theme === "system" && prefersDark) ||
					(!theme && prefersDark)
				) {
					document.documentElement.classList.add("dark");
				}
			})();
		</script>

		<!-- External Scripts -->
		<script src="https://accounts.google.com/gsi/client" async></script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
