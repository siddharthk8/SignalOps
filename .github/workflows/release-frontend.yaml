name: Release Frontend

on:
  push:
    tags:
      - "frontend-v*"

jobs:
  release:
    name: Release Frontend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment: Production

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag is on main
        run: |
          git fetch origin main

          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/main"; then
            echo "::error::Release tag $GITHUB_REF_NAME is not on main."
            echo "Tag commit: $TAG_COMMIT"
            exit 1
          fi

          echo "Release tag $GITHUB_REF_NAME is on main."

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#frontend-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing frontend version: $VERSION"

      - name: Validate project version
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        working-directory: frontend
        run: |
          PROJECT_VERSION=$(node -p "require('./package.json').version")

          echo "Git tag version: $TAG_VERSION"
          echo "Project version: $PROJECT_VERSION"

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Version mismatch!"
            exit 1
          fi

      # AWS authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # ECR login
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Build and push
      - name: Build, tag, and push docker image to Amazon ECR
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true

          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            ENV=${{ vars.ENV }}

          tags: |
            ${{ steps.login-ecr.outputs.registry }}/signalops/frontend:${{ steps.version.outputs.version }}

  deploy:
    name: Deploy Frontend
    needs: release

    permissions:
      contents: read
      id-token: write

    uses: ./.github/workflows/deploy-production.yaml

    with:
      component: frontend
      version: ${{ needs.release.outputs.version }}

    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
