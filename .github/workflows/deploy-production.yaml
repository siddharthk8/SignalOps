name: Deploy Production

on:
  workflow_call:
    inputs:
      component:
        description: "Component being deployed: backend or frontend"
        required: true
        type: string

      version:
        description: "Version of the component being released"
        required: true
        type: string

    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true

permissions:
  contents: read
  id-token: write

# Only one production deployment can run at a time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.component }} ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate component
        run: |
          case "${{ inputs.component }}" in
            backend|frontend)
              echo "Valid component: ${{ inputs.component }}"
              ;;
            *)
              echo "::error::Invalid component: ${{ inputs.component }}"
              echo "Expected: backend or frontend"
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          echo "Production deployment"
          echo "Component: $COMPONENT"
          echo "Version:   $VERSION"

          # Determine deployment configuration

          if [ "$COMPONENT" = "backend" ]; then
            COMPOSE_SERVICE="backend"
            IMAGE_VARIABLE="BACKEND_IMAGE_TAG"
          else
            COMPOSE_SERVICE="frontend"
            IMAGE_VARIABLE="FRONTEND_IMAGE_TAG"
          fi

          echo "Compose service: $COMPOSE_SERVICE"
          echo "Image variable:  $IMAGE_VARIABLE"

          # Build remote deployment script

          COMMANDS=$(cat <<EOF_DEPLOYMENT
          #!/bin/bash

          echo "Shell: \$SHELL"
          echo "Bash version: \$BASH_VERSION"

          set -euo pipefail

          cd /opt/signalops

          source "/opt/infra/scripts/init-context.sh" signalops

          # ---------------- Configure deployment logging ---------------------

          LOG_FILE="\$A_GITHUB_ACTIONS_LOG_FILE"

          if [ -z "\$LOG_FILE" ]; then
            echo "::error::A_GITHUB_ACTIONS_LOG_FILE is not configured."
            exit 1
          fi

          LOG_DIRECTORY=\$(dirname "\$LOG_FILE")

          mkdir -p "\$LOG_DIRECTORY"

          # Save all stdout and stderr to the log file
          # while also displaying it in the SSM output.
          exec > >(tee -a "\$LOG_FILE") 2>&1

          echo "Deployment log file: \$LOG_FILE"
          echo "Deployment started at: \$(date -Is)"

          VARIABLES_FILE="\$A_DOCKER_VARIABLES_FILE"
          SECRETS_FILE="\$A_DOCKER_SECRETS_FILE"
          COMPOSE_FILE="\$A_DOCKER_COMPOSE_FILE"

          echo "Using:"
          echo "  Variables: \$VARIABLES_FILE"
          echo "  Secrets:   \$SECRETS_FILE"
          echo "  Compose:   \$COMPOSE_FILE"

          # Validate deployment files

          if [ ! -f "\$VARIABLES_FILE" ]; then
            echo "::error::Variables file does not exist: \$VARIABLES_FILE"
            exit 1
          fi

          if [ ! -f "\$SECRETS_FILE" ]; then
            echo "::error::Secrets file does not exist: \$SECRETS_FILE"
            exit 1
          fi

          if [ ! -f "\$COMPOSE_FILE" ]; then
            echo "::error::Compose file does not exist: \$COMPOSE_FILE"
            exit 1
          fi

          # Update requested image tag

          echo "Updating $IMAGE_VARIABLE to $VERSION..."

          if grep -q "^$IMAGE_VARIABLE=" "\$VARIABLES_FILE"; then
            sed -i "s|^$IMAGE_VARIABLE=.*|$IMAGE_VARIABLE=$VERSION|" "\$VARIABLES_FILE"
          else
            echo "::error::$IMAGE_VARIABLE is missing from \$VARIABLES_FILE"
            echo "Expected an existing $IMAGE_VARIABLE entry."
            exit 1
          fi

          echo "Current deployment versions:"

          grep -E '^(BACKEND_IMAGE_TAG|FRONTEND_IMAGE_TAG)=' \
            "\$VARIABLES_FILE"

          # ECR Authentication

          echo "Authenticating Docker with Amazon ECR..."

          aws ecr get-login-password \
            --region "$AWS_REGION" |
            sudo docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "ECR authentication successful."

          # Backend deployment

          if [ "$COMPONENT" = "backend" ]; then

            echo "Pulling backend image..."

            docker compose \
              --env-file "\$VARIABLES_FILE" \
              --env-file "\$SECRETS_FILE" \
              -f "\$COMPOSE_FILE" \
              pull backend migrate

            echo "Running database migrations..."

            docker compose \
              --env-file "\$VARIABLES_FILE" \
              --env-file "\$SECRETS_FILE" \
              -f "\$COMPOSE_FILE" \
              run --rm migrate

            echo "Database migrations completed successfully."

            echo "Deploying backend..."

            docker compose \
              --env-file "\$VARIABLES_FILE" \
              --env-file "\$SECRETS_FILE" \
              -f "\$COMPOSE_FILE" \
              up -d \
              --no-build \
              backend

          # Frontend deployment

          else

            echo "Pulling frontend image..."

            docker compose \
              --env-file "\$VARIABLES_FILE" \
              --env-file "\$SECRETS_FILE" \
              -f "\$COMPOSE_FILE" \
              pull frontend

            echo "Deploying frontend..."

            docker compose \
              --env-file "\$VARIABLES_FILE" \
              --env-file "\$SECRETS_FILE" \
              -f "\$COMPOSE_FILE" \
              up -d \
              --no-build \
              frontend

          fi

          echo "Deployment completed successfully."

          EOF_DEPLOYMENT
          )

          # Find EC2 instance

          echo "Finding EC2 instance..."

          EC2_INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Project,Values=signalops" \
            --filters "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$EC2_INSTANCE_ID" ] || [ "$EC2_INSTANCE_ID" = "None" ]; then
            echo "::error::No running EC2 instance found."
            exit 1
          fi

          echo "EC2 instance: $EC2_INSTANCE_ID"

          # Send deployment command through SSM

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $COMPONENT=$VERSION" \
            --parameters "commands=$(printf '%s\n' "$COMMANDS" | jq -R -s -c 'split("\n")[:-1]')" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"
          echo "Waiting for EC2 deployment..."

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          echo "Deployment successful."
