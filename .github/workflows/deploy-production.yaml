name: Deploy Production

on:
  workflow_call:
    inputs:
      component:
        description: "Component being deployed: backend or frontend"
        required: true
        type: string

      version:
        description: "Version of the component being released"
        required: true
        type: string

    secrets:
      AWS_DEPLOY_ROLE_ARN:
        required: true

permissions:
  contents: read
  id-token: write

# Only one production deployment can run at a time.
# If backend and frontend are released together, the second deployment waits.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.component }} ${{ inputs.version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate component
        run: |
          case "${{ inputs.component }}" in
            backend|frontend)
              echo "Valid component: ${{ inputs.component }}"
              ;;
            *)
              echo "::error::Invalid component: ${{ inputs.component }}"
              echo "Expected: backend or frontend"
              exit 1
              ;;
          esac

      - name: Extract image versions
        id: versions
        env:
          COMPONENT: ${{ inputs.component }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ "$COMPONENT" = "backend" ]; then
            BACKEND_VERSION="$RELEASE_VERSION"

            FRONTEND_VERSION=$(node -p "require('./frontend/package.json').version")

          else
            FRONTEND_VERSION="$RELEASE_VERSION"

            BACKEND_VERSION=$(python - <<'PY'
          import tomllib

          with open("backend/pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          print(data["project"]["version"])
          PY
          )
          fi

          echo "backend_version=$BACKEND_VERSION" >> "$GITHUB_OUTPUT"
          echo "frontend_version=$FRONTEND_VERSION" >> "$GITHUB_OUTPUT"

          echo "Production versions..."
          echo "Backend : $BACKEND_VERSION"
          echo "Frontend: $FRONTEND_VERSION"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy to EC2
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

          BACKEND_VERSION: ${{ steps.versions.outputs.backend_version }}
          FRONTEND_VERSION: ${{ steps.versions.outputs.frontend_version }}
        run: |
          set -euo pipefail

          BACKEND_IMAGE="$DOCKERHUB_USERNAME/signalops-backend:$BACKEND_VERSION"
          FRONTEND_IMAGE="$DOCKERHUB_USERNAME/signalops-frontend:$FRONTEND_VERSION"

          echo "Production Deployment..."

          COMMANDS=$(cat <<EOF
          set -euo pipefail

          cd /home/ubuntu/signalops

          export DOCKERHUB_USERNAME="$DOCKERHUB_USERNAME"
          export BACKEND_IMAGE_TAG="$BACKEND_VERSION"
          export FRONTEND_IMAGE_TAG="$FRONTEND_VERSION"

          source "/opt/infra/scripts/init-context.sh" signalops

          echo "Pulling backend image..."
          docker pull "\$BACKEND_IMAGE"

          echo "Pulling frontend image..."
          docker pull "\$FRONTEND_IMAGE"

          echo "Starting production services..."

          docker compose \
            --env-file "\$A_DOCKER_VARIABLES_FILE" \
            --env-file "\$A_DOCKER_SECRETS_FILE" \
            -f "\$A_DOCKER_COMPOSE_FILE" \
            up -d \
            --no-build

          echo "Waiting for services to start..."
          sleep 15

          echo "Production containers:"

          docker compose \
            --env-file "\$A_DOCKER_VARIABLES_FILE" \
            --env-file "\$A_DOCKER_SECRETS_FILE" \
            -f "\$A_DOCKER_COMPOSE_FILE" \
            ps

          echo "Cleaning unused Docker images..."
          docker image prune -af

          echo "Deployment completed successfully."
          EOF
          )

          echo "Finding EC2 instance..."

          EC2_INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Project,Values=signalops" \
            --filters "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$EC2_INSTANCE_ID" ] || [ "$EC2_INSTANCE_ID" = "None" ]; then
            echo "ERROR: No running EC2 instance found."
            exit 1
          fi

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy backend=$BACKEND_VERSION frontend=$FRONTEND_VERSION" \
            --parameters "commands=$(printf '%s\n' "$COMMANDS" | jq -R -s -c 'split("\n")[:-1]')" \
            --query "Command.CommandId" \
            --output text)

          echo "Waiting for EC2 deployment..."

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          echo "Deployment successful"
