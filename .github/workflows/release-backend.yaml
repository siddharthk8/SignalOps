name: Release Backend

on:
  push:
    tags:
      - "backend-v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/backend-ci.yaml
    secrets:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  release:
    needs: ci
    name: Release Backend
    runs-on: ubuntu-latest

    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag is on main
        run: |
          git fetch origin main

          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/main"; then
            echo "::error::Release tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi

          echo "Release tag $GITHUB_REF_NAME is on main."

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#backend-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing backend version: $VERSION"

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      - name: Validate project version
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PROJECT_VERSION=$(python - <<'PY'
          import tomllib

          with open("backend/pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          print(data["project"]["version"])
          PY
          )

          echo "Git tag version:     $TAG_VERSION"
          echo "Project version:     $PROJECT_VERSION"

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Version mismatch!"
            exit 1
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/signalops-backend:${{ steps.version.outputs.version }}
