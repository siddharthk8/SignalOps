name: Release Backend

on:
  push:
    tags:
      - "backend-v*"

jobs:
  ci:
    uses: ./.github/workflows/backend-ci.yaml
    secrets:
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

  release:
    needs: ci
    name: Release Backend
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    environment: Production

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag is on main
        run: |
          git fetch origin main

          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "origin/main"; then
            echo "::error::Release tag $GITHUB_REF_NAME is not on main."
            echo "Tag commit: $TAG_COMMIT"
            exit 1
          fi

          echo "Release tag $GITHUB_REF_NAME is on main."

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#backend-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing backend version: $VERSION"

      - name: Validate project version
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          PROJECT_VERSION=$(python - <<'PY'
          import tomllib

          with open("backend/pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          print(data["project"]["version"])
          PY
          )

          echo "Git tag version:     $TAG_VERSION"
          echo "Project version:     $PROJECT_VERSION"

          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "::error::Version mismatch!"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"

      # AWS authentication
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      # ECR authentication
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Build and push
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/signalops/backend:${{ steps.version.outputs.version }}

  deploy:
    name: Deploy Backend
    needs: release

    permissions:
      contents: read
      id-token: write

    uses: ./.github/workflows/deploy-production.yaml

    with:
      component: backend
      version: ${{ needs.release.outputs.version }}

    secrets:
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
