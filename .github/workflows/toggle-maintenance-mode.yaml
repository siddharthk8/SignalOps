name: Toggle Production Maintenance

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  toggle-maintenance:
    name: Toggle production maintenance mode
    runs-on: ubuntu-latest

    environment: Production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Toggle maintenance mode
      - name: Toggle maintenance mode
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          echo "Finding EC2 instance..."

          EC2_INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Project,Values=signalops" \
            --filters "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$EC2_INSTANCE_ID" ] || [ "$EC2_INSTANCE_ID" = "None" ]; then
            echo "ERROR: No running EC2 instance found."
            exit 1
          fi

          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=[
                "set -e",
                "MAINTENANCE_FILE=/home/ubuntu/signalops/nginx/maintenance/maintenance.enable",
                "",
                "if [ -f \"$MAINTENANCE_FILE\" ]; then",
                "  echo \"Maintenance mode is ON. Disabling maintenance mode...\"",
                "  rm -f \"$MAINTENANCE_FILE\"",
                "  MAINTENANCE_STATUS=OFF",
                "else",
                "  echo \"Maintenance mode is OFF. Enabling maintenance mode...\"",
                "  touch \"$MAINTENANCE_FILE\"",
                "  MAINTENANCE_STATUS=ON",
                "fi",
                "",
                "echo \"Maintenance status: $MAINTENANCE_STATUS\""
              ]' \
              --query 'Command.CommandId' \
              --output text
          )

          echo "Waiting for command to complete..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          echo "Maintenance toggle completed."
