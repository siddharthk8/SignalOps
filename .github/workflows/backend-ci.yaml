name: Backend CI

on:
  workflow_dispatch: # Enables the manual "Run workflow" button
  workflow_call: # That means another workflow can call this workflow.

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yaml"

  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yaml"

permissions:
  contents: read

jobs:
  backend-ci:
    name: CI for Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # GitHub Environment.
    # Variables are accessed through vars.*
    # Secrets are accessed through secrets.*
    environment: Test

    defaults:
      run:
        working-directory: backend # This setting applies only to `run:` steps, not `uses:` actions.

    # PostgreSQL service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ vars.DB_NAME }}
          POSTGRES_USER: ${{ vars.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ vars.DB_USERNAME }} -d ${{ vars.DB_NAME }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Backend/test environment
    env:
      ENV_FILE: .env.test
      TESTING: "true"

      # Database
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      # Get code into this GitHub runner VM
      - name: Checkout repository
        uses: actions/checkout@v7

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run migrations
      - name: Run Alembic migrations
        run: alembic upgrade head

      # Check formatting
      - name: Check formatting
        run: ruff format --check .

      # Lint
      - name: Lint
        run: ruff check .

      # Run tests
      - name: Run pytest
        run: pytest tests -v
