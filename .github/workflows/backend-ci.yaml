name: Backend CI

on:
  workflow_dispatch: # Enables the manual "Run workflow" button

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yaml"

  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yaml"

permissions:
  contents: read

jobs:
  backend-ci:
    name: CI for Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # GitHub Environment.
    # Variables are accessed through vars.*
    # Secrets are accessed through secrets.*
    environment: test

    defaults:
      run:
        working-directory: backend # This setting applies only to `run:` steps, not `uses:` actions.

    # PostgreSQL service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ vars.DB_NAME }}
          POSTGRES_USER: ${{ vars.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ vars.DB_USERNAME }} -d ${{ vars.DB_NAME }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Backend/test environment
    env:
      # Database
      DB_DRIVER: ${{ vars.DB_DRIVER }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USERNAME: ${{ vars.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      S3_BUCKET_REGION: ${{ vars.S3_BUCKET_REGION }}

      # AWS
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      MAIL_FROM: ${{ vars.MAIL_FROM }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}

      # Application / frontend configuration
      BACKEND_IMAGE_TAG: ${{ vars.BACKEND_IMAGE_TAG }}
      FRONTEND_IMAGE_TAG: ${{ vars.FRONTEND_IMAGE_TAG }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      ENV_DIR: ${{ vars.ENV_DIR }}

      # Testing
      TESTING: ${{ vars.TESTING }}

    steps:
      # Get code into this GitHub runner VM
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run migrations
      - name: Run Alembic migrations
        run: alembic upgrade head

      # Check formatting
      - name: Check formatting
        run: ruff format --check .

      # Lint
      - name: Lint
        run: ruff check .

      # Run tests
      - name: Run pytest
        run: pytest tests -v
