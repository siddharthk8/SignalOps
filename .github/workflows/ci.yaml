name: Backend Tests

on:
  workflow_dispatch: # Enables the manual "Run workflow" button

  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - ".github/workflows/ci.yaml"

  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yaml"

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend # This setting applies only to `run:` steps, not `uses:` actions.

    # PostgreSQL service
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass85
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    # Environment variables for backend/tests
    env:
      # Required because Alembic migrations and Pydantic settings are loaded before pytest starts.
      SECRET_KEY: "dummy-secret-key-for-testing-only"
      DATABASE_URL: "postgresql+psycopg://testuser:testpass85@localhost:5432/testdb"
      BEDROCK_MODEL_ID: "testing-model"
      S3_BUCKET_NAME: "test-bucket"
      S3_BUCKET_REGION: "ap-south-1"
      AWS_ACCESS_KEY_ID: "testing"
      AWS_SECRET_ACCESS_KEY: "testing"
      MAIL_FROM: "test.sender@example.com"
      TESTING: "true"

    steps:
      # Get code into this Github runner VM
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run migrations (Alembic)
      - name: Run Alembic migrations
        run: alembic upgrade head

      # Run tests
      - name: Run pytest
        run: pytest tests -v